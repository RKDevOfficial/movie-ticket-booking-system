{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | RK Tickets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, sans-serif;
      background: #101722;
      color: #f2f5fc;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      place-items: center;
      background: radial-gradient(ellipse at 75% 0%, rgb(177 91 34 / 16%), transparent 42%), #101722;
    }

    .login-card {
      width: min(100%, 27rem);
      padding: clamp(1.5rem, 5vw, 2.5rem);
      border: 1px solid rgb(151 171 201 / 14%);
      border-radius: 1rem;
      background: linear-gradient(145deg, #202936, #171f2a);
      box-shadow: 0 18px 48px rgb(0 0 0 / 24%);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 2rem;
    }

    .brand img { width: 3.5rem; height: 3.5rem; object-fit: contain; }
    .brand-name { font-size: 1.2rem; font-weight: 700; }
    .brand-name span { color: #ff9a3c; }
    .brand-tagline { margin-top: 0.25rem; color: #a5a7a8; font-size: 0.75rem; }
    h1 { margin: 0; font-size: 1.6rem; }
    .intro { margin: 0.5rem 0 1.5rem; color: #a5a7a8; font-size: 0.9rem; }

    .field { display: flex; flex-direction: column; gap: 0.45rem; margin: 0 0 1rem; }
    label { color: #d4d6d8; font-size: 0.85rem; font-weight: 500; }
    input {
      width: 100%;
      min-height: 2.8rem;
      padding: 0.65rem 0.8rem;
      border: 1px solid rgb(151 171 201 / 20%);
      border-radius: 0.6rem;
      background: #111923;
      color: #f2f5fc;
      font: inherit;
    }
    input:focus { border-color: #f28a2e; outline: 2px solid rgb(242 138 46 / 20%); }
    .password-control { position: relative; }
    .password-control input { padding-right: 3rem; }
    .password-toggle {
      position: absolute;
      top: 50%;
      right: 0.45rem;
      display: grid;
      width: 2.2rem;
      height: 2.2rem;
      padding: 0;
      place-items: center;
      transform: translateY(-50%);
      border: 0;
      border-radius: 0.45rem;
      background: transparent;
      color: #a5a7a8;
      cursor: pointer;
    }
    .password-toggle:hover, .password-toggle:focus-visible { background: rgb(242 138 46 / 11%); color: #fff; }
    .password-toggle:focus-visible { outline: 2px solid #f28a2e; }
    .password-toggle svg { display: block; width: 1.25rem; height: 1.25rem; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .password-toggle .eye-closed,
    .password-toggle[aria-pressed="true"] .eye-open { display: none; }
    .password-toggle[aria-pressed="true"] .eye-closed { display: block; }
    .form-error { margin-bottom: 1rem; color: #ff9b9b; font-size: 0.85rem; }
    .login-button {
      display: flex;
      width: 100%;
      min-height: 2.9rem;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.4rem;
      border: 0;
      border-radius: 0.6rem;
      background: linear-gradient(110deg, #ffad4d, #f47a20);
      color: #22170d;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .login-button:hover { filter: brightness(1.08); }
    .material-symbols-rounded { font-size: 1.2rem; }
    .signup-link { margin: 1.25rem 0 0; color: #a5a7a8; font-size: 0.85rem; text-align: center; }
    .signup-link a { color: #ffad4d; font-weight: 600; text-decoration: none; }
    .signup-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand">
      <img src="{% static 'assets/img/logo.png' %}" alt="">
      <div>
        <div class="brand-name"><span>RK</span> TICKETS</div>
        <div class="brand-tagline">Your Cinema Experience Starts Here</div>
      </div>
    </div>
    <h1>Welcome back</h1>
    <p class="intro">Log in to manage your cinema bookings.</p>
    <form method="post">
      {% csrf_token %}
      {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" value="{{ username }}" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-control">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button class="password-toggle" type="button" aria-label="Show password" title="Show password" aria-pressed="false">
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
              <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a14.8 14.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7a10.5 10.5 0 0 0 5.8-1.8"></path>
            </svg>
          </button>
        </div>
      </div>
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button class="login-button" type="submit">
        <span class="material-symbols-rounded" aria-hidden="true">login</span>
        Log in
      </button>
    </form>
    <p class="signup-link">Don’t have an account? <a href="{% url 'signup' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Create an account</a></p>
  </main>
  <script>
    document.querySelectorAll(".password-toggle").forEach((toggle) => {
      toggle.addEventListener("click", () => {
        const password = toggle.previousElementSibling;
        const isVisible = password.type === "text";
        password.type = isVisible ? "password" : "text";
        toggle.setAttribute("aria-pressed", String(!isVisible));
        toggle.setAttribute("aria-label", `${isVisible ? "Show" : "Hide"} password`);
        toggle.title = toggle.getAttribute("aria-label");
      });
    });
  </script>
</body>
</html>

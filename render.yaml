databases:
  - name: movie-ticket-booking-db
    plan: free
    databaseName: movie_ticket_booking
    user: movie_ticket_booking

services:
  - type: web
    name: movie-ticket-booking
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --no-input && python manage.py bootstrap_admin && gunicorn movie_booking_project.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: movie-ticket-booking-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: 3.13.4
